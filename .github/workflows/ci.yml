# Public CI for the standalone thrustlab-sdk repository.
#
# This file is the SOURCE template kept in the monorepo. The extraction script
# (scripts/publish_public_repo.sh) copies it into the public mirror as
# .github/workflows/ci.yml. It installs the package and runs the unit test
# suite (integration tests, which require a live API key, are excluded).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not integration" -ra --tb=short
