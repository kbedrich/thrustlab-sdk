[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "thrustlab"
dynamic = ["version"]
description = "Official Python SDK for the ThrustLab API"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ThrustLab", email = "support@thrustlab.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "attrs>=23.0",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "openapi-python-client==0.28.4",
]

[project.urls]
Homepage = "https://thrustlab.com"
Documentation = "https://thrustlab.com/docs"
Repository = "https://github.com/kbedrich/thrustlab-sdk"
Changelog = "https://thrustlab.com/docs/changelog"

[tool.hatch.version]
path = "thrustlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["thrustlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/thrustlab",
  "/tests",
  "/examples",
  "/pyproject.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]
