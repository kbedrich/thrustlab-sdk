[build-system]
# 1.32.0 emits core-metadata 2.5, which PyPI's upload validator does not accept
# yet (400 Bad Request AFTER the file uploads — measured on the 0.4.0 release,
# 2026-08-31). 1.27.0 emits metadata 2.4, the newest version Warehouse takes.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "thrustlab"
dynamic = ["version"]
description = "Official Python SDK for the ThrustLab API"
readme = "README.md"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ThrustLab", email = "support@thrustlab.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "attrs>=23.0",
  "python-dateutil>=2.8",
  # The SITL physics bridge (thrustlab.sitl) works out of the box — owner
  # decision 2026-08-30: no extra, no import-time surprise.
  "numpy>=1.24",
  "PyYAML>=6.0",
  "fmpy>=0.3.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "openapi-python-client==0.28.4",
]
# Kept as an empty alias so `pip install "thrustlab[sitl]"` from early docs
# still resolves; the bridge dependencies are core requirements now.
sitl = []

[project.scripts]
thrustlab-sitl = "thrustlab.sitl.cli:main"

[project.urls]
Homepage = "https://thrustlab.com"
Documentation = "https://thrustlab.com/docs"
Repository = "https://github.com/kbedrich/thrustlab-sdk"
Changelog = "https://thrustlab.com/docs/changelog"

[tool.hatch.version]
path = "thrustlab/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["thrustlab"]

[tool.hatch.build.targets.sdist]
# The bundled example FMUs live in the repo for out-of-the-box examples; the
# sdist stays source-only (each is 4-10 MB of binary).
exclude = ["*.fmu"]
include = [
  "/thrustlab",
  "/tests",
  "/examples",
  "/pyproject.toml",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
]
